```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SLIM Pattern Viewer</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div id="topbar">
      <h1>
        SLIM Pattern Viewer
        <span id="filename"></span>
      </h1>

      <label class="file-btn">
        Load JSON
        <input type="file" id="file-input" accept=".json">
      </label>

      <div id="view-mode">
        <button id="view-itemV-btn" class="view-mode-btn active">
          Vrekeen Items
        </button>

        <button id="view-itemO-btn" class="view-mode-btn">
          Original Items
        </button>
      </div>

      <div id="status">No data loaded</div>

      <div id="legend">
        <span>High frequency</span>
        <div class="bar"></div>
        <span>Low frequency</span>
      </div>
    </div>

    <div id="canvas-wrap">
      <div id="empty-state">
        <strong>No tree loaded</strong>
        <div>
          Load the output.json generated by FPTreeBuilder to visualize it here.
        </div>
      </div>

      <svg id="svg" style="display: none;"></svg>
    </div>

    <div id="tooltip"></div>

    <!-- Order matters -->
    <script src="js/tooltip.js"></script>
    <script src="js/tree.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
